<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="BestiZ" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Two overlapping circles.

    The mark is the product: two people, and the part they share. It stays
    legible at 16px because it is two strokes and nothing else, and the two
    circles are different colours so the overlap still reads once the shape
    is too small to see the outlines separately.
  -->
  <rect width="48" height="48" rx="12" fill="#5A48E8"/>
  <circle cx="19" cy="24" r="8.5" fill="none" stroke="#FFFFFF" stroke-width="3.4"/>
  <circle cx="29" cy="24" r="8.5" fill="none" stroke="#FFB3AC" stroke-width="3.4"/>
</svg>
