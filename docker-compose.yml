# Docker Compose: orchestrates the entire BestiZ system.
# Per assignment requirement: `docker compose up` runs the whole app.


services:

  # PostgreSQL database
  #
  # Deliberately starts empty. The schema is applied by the server's migration
  # runner, which is the same path the deployed database takes — see the
  # `command` on the server service below.
  postgres:
    image: postgres:16-alpine
    container_name: bestiz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Expose to host for local debugging tools (psql, DBeaver). Safe to remove in production.
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  
  # Express + JavaScript backend
  
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    container_name: bestiz_server
    restart: unless-stopped
    # Migrate, then serve.
    #
    # This used to be done by mounting the migrations directory into Postgres'
    # /docker-entrypoint-initdb.d, which runs every .sql file once, when the
    # data volume is first created. That left the local database and the
    # deployed one being built by two different mechanisms: the deployed one
    # has no such hook and is built by `npm run migrate`, which records what it
    # has applied in `schema_migrations`.
    #
    # The two agreed only by coincidence. Locally the ledger stayed empty, so
    # the first migration added after the volume existed would have been
    # applied to the deployed database and silently skipped here — and the
    # divergence would surface as a confusing runtime error rather than as a
    # failed migration.
    #
    # `depends_on: service_healthy` means Postgres is already accepting
    # connections by this point. A failed migration exits the container instead
    # of serving against a schema that is not what the code expects.
    command: sh -c "npm run migrate && npm run dev"
    environment:
      NODE_ENV: ${NODE_ENV}
      SERVER_PORT: ${SERVER_PORT}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      CLIENT_URL: ${CLIENT_URL}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    volumes:
      # Mount source for hot reload in development.
      - ./server/src:/app/src
      # Anonymous volume for node_modules so the host folder doesn't shadow the container's.
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  
  # React + Vite frontend
  
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: development
    container_name: bestiz_client
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "${CLIENT_PORT}:5173"
    volumes:
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html
      - ./client/vite.config.js:/app/vite.config.js
      - /app/node_modules
    depends_on:
      - server

volumes:
  postgres-data: